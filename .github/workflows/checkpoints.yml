name: Frozen checkpoint integration
on: workflow_dispatch
permissions:
  contents: read

jobs:
  benchmark-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "4"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned CPU runtime
        run: |
          python -m pip install --no-cache-dir torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir transformers==4.51.3 numpy==1.26.4 safetensors==0.5.3
      - name: Check pinned weights, live hooks and the two rulebooks
        run: python scripts/check_checkpoints.py
